<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FaithView Pro — Output</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    overflow:hidden;
    background:#000;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Hide cursor after 2s of inactivity on projector */
  body.hide-cursor, body.hide-cursor *{ cursor:none !important; }

  /* ---------- Presentation stage ---------- */
  #stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:7vmin 9vmin;
    background: radial-gradient(circle at 50% 30%, #64a3f5 0%, #2560d0 55%, #0b1e45 100%);
    opacity:0;
    transition: opacity .45s ease;
  }
  #stage.live{ opacity:1; }

  #verse-text{
    color:#fff;
    font-weight:700;
    line-height:1.38;
    font-size:5.2vmin;
    max-width:88vmin;
    text-shadow: 0 2px 14px rgba(11,30,69,.4);
  }
  #verse-ref{
    margin-top:4.5vmin;
    color:#c9dfff;
    font-weight:600;
    font-size:2.6vmin;
    letter-spacing:.1em;
  }

  /* ---------- Connection status dot ---------- */
  #status{
    position:fixed; top:16px; right:16px; z-index:20;
    width:10px; height:10px; border-radius:50%;
    background:#dc2626;
    transition: opacity .5s ease;
  }
  #status.live{ background:#16a34a; opacity:0; }

  /* ---------- Hint banner ---------- */
  #hint{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:20;
    background: rgba(18,35,58,.88);
    color:#fff; font-size:13px; font-weight:600;
    padding:9px 18px; border-radius:999px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    transition: opacity .6s ease;
    white-space:nowrap;
  }

  /* ---------- Alert ticker (lower third) ---------- */
  #alert-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:#8b6bff;
    overflow:hidden; height:0;
    transition: height .3s ease;
  }
  #alert-bar.active{ height:44px; }
  #alert-bar .ticker{
    display:flex; align-items:center;
    height:44px; white-space:nowrap;
    animation: alertScroll 12s linear infinite;
  }
  #alert-bar .ticker span{
    display:inline-block;
    padding:0 60px;
    font-size:16px; font-weight:700; color:#fff;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @keyframes alertScroll{
    0%{ transform:translateX(100vw); }
    100%{ transform:translateX(-100%); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="verse-text"></div>
  <div id="verse-ref"></div>
</div>
<div id="status" title="disconnected"></div>
<div id="hint">Drag this window to your projector screen, then press <b>F</b> or <b>double-click</b> for fullscreen</div>
<div id="alert-bar"><div class="ticker" id="alert-ticker"></div></div>

<script>
const WS_URL = (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws";

const stage = document.getElementById("stage");
const txt = document.getElementById("verse-text");
const ref = document.getElementById("verse-ref");
const statusEl = document.getElementById("status");
const hint = document.getElementById("hint");

// Shrink-to-fit: long verses always stay fully on screen
function fit(){
  let size = 5.2;
  txt.style.fontSize = size + "vmin";
  while (size > 1.6 && stage.scrollHeight > window.innerHeight){
    size -= 0.2;
    txt.style.fontSize = size + "vmin";
  }
}
window.addEventListener("resize", fit);

function showSlide(text, reference){
  // Reset stage for plain text mode (flex centering)
  stage.style.display = 'flex';
  stage.style.flexDirection = 'column';
  stage.style.alignItems = 'center';
  stage.style.justifyContent = 'center';
  stage.style.padding = '7vmin 9vmin';
  stage.querySelectorAll('.theme-el').forEach(e => e.remove());
  txt.style.display = '';
  ref.style.display = '';
  txt.textContent = text || "";
  ref.textContent = reference || "";
  stage.classList.add("live");
  fit();
}
function clearSlide(){
  stage.classList.remove("live");
  stage.querySelectorAll('.theme-el').forEach(e => e.remove());
  txt.textContent = '';
  ref.textContent = '';
  // Reset to default flex layout
  stage.style.display = 'flex';
  stage.style.flexDirection = 'column';
  stage.style.alignItems = 'center';
  stage.style.justifyContent = 'center';
  stage.style.padding = '7vmin 9vmin';
}

function connect(){
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => statusEl.classList.add("live");
  ws.onclose = () => { statusEl.classList.remove("live"); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "display_update"){
      if (m.clear){
        clearSlide();
      } else {
        // If a full theme payload is present, render elements
        if (m.theme && typeof m.theme === 'object'){
          renderTheme(m.theme);
        } else {
          const r = (m.reference || "").toUpperCase();
          const t = m.translation ? " (" + m.translation + ")" : "";
          showSlide(m.text, r + t);
        }
      }
    }
    if (m.type === "alert_update"){
      const bar = document.getElementById("alert-bar");
      const ticker = document.getElementById("alert-ticker");
      if (m.alert && m.alert.text){
        bar.classList.add("active");
        ticker.innerHTML = "<span>" + m.alert.text + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + m.alert.text + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + m.alert.text + "</span>";
        const speeds = {"very slow":"20s","slow":"15s","medium":"10s","fast":"6s","very fast":"4s"};
        const dur = speeds[(m.alert.speed||"").toLowerCase()] || "10s";
        ticker.style.animationDuration = dur;
      } else {
        bar.classList.remove("active");
        ticker.innerHTML = "";
      }
    }
  };
}
connect();

function renderTheme(theme){
  try{
    // Reset stage: no padding so absolute % elements align exactly as designed
    stage.style.position = 'fixed';
    stage.style.inset = '0';
    stage.style.display = 'block';
    stage.style.padding = '0';
    stage.style.margin = '0';
    stage.style.textAlign = 'center';
    stage.style.transition = 'opacity .45s ease, background .3s ease';
    stage.style.background = '';
    stage.style.backgroundImage = '';

    // ---- Background ----
    // Settings format: theme.canvas = { bgType, bgColor, bgImage, bgFit, bgOpacity }
    // Standalone format: theme.background = { color, image }
    const canvasCfg = theme.canvas;
    const bgObj = theme.background;
    if (canvasCfg){
      if (canvasCfg.bgType === 'image' && canvasCfg.bgImage){
        stage.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.25)),url("' + canvasCfg.bgImage + '")';
        stage.style.backgroundSize = canvasCfg.bgFit || 'cover';
      } else {
        stage.style.background = canvasCfg.bgColor || '#000';
      }
    } else if (bgObj){
      if (bgObj.image && bgObj.image !== 'none' && !bgObj.image.startsWith('none')){
        stage.style.backgroundImage = bgObj.image;
        stage.style.backgroundSize = 'cover';
      } else if (bgObj.color){
        stage.style.background = bgObj.color;
      }
    }

    // ---- Elements ----
    // Remove old theme elements
    stage.querySelectorAll('.theme-el').forEach(e => e.remove());
    txt.textContent = '';
    ref.textContent = '';
    txt.style.display = 'none';
    ref.style.display = 'none';

    let hasRendered = false;

    // Default element styles by type (for fallback when no style data exists)
    const TYPE_DEFAULTS = {
      verse:  { width:'84%', left:'8%', top:'20%', textAlign:'center', fontWeight:600, fontSize:'clamp(24px,4vw,44px)', lineHeight:'1.25', color:'#fff' },
      ref:    { width:'76%', left:'12%', top:'62%', textAlign:'center', fontSize:'18px', fontWeight:700, letterSpacing:'.06em', color:'#f1d9a3', textTransform:'uppercase' },
      copy:   { left:'22px', bottom:'16px', fontSize:'12px', color:'rgba(255,255,255,.98)' },
      logo:   { right:'24px', top:'20px', width:'65px', height:'65px' },
    };

    if (Array.isArray(theme.elements) && theme.elements.length){
      for (const el of theme.elements){
        if (!el || !el.type) continue;

        const div = document.createElement('div');
        div.className = 'theme-el';
        const defaults = TYPE_DEFAULTS[el.type] || {};

        if (el.style){
          // Style string contains percentage-based positioning from captureThemeState()
          div.style.cssText = el.style;
          // Ensure position context
          if (!/position\s*:/i.test(el.style)) div.style.position = 'absolute';
          div.style.textShadow = '0 2px 14px rgba(0,0,0,0.4)';
          div.style.justifyContent = 'center';
          div.textContent = el.text || '';
        } else if (canvasCfg){
          // ---- Settings format: structured x/y/w/h ----
          const W = canvasCfg.width || 1920;
          const H = canvasCfg.height || 1080;
          div.style.position = 'absolute';
          div.style.left = ((el.x || 0) / W * 100) + '%';
          div.style.top = ((el.y || 0) / H * 100) + '%';
          div.style.width = ((el.w || 80) / W * 100) + '%';
          div.style.height = ((el.h || 10) / H * 100) + '%';
          div.style.display = 'flex';
          div.style.alignItems = 'center';
          div.style.justifyContent = el.align === 'center' ? 'center' : el.align === 'right' ? 'flex-end' : 'flex-start';
          div.style.textAlign = el.align || 'center';
          div.style.fontFamily = el.font || 'Georgia, serif';
          div.style.fontSize = ((el.size || 40) / H * 100) + 'vmin';
          div.style.fontWeight = el.weight || 600;
          div.style.color = el.color || '#fff';
          div.style.opacity = (el.opacity != null ? el.opacity : 1);
          div.style.letterSpacing = (el.letterSpacing || 0) + 'px';
          div.style.lineHeight = el.lineHeight || 1.25;
          div.style.overflow = 'hidden';
          div.style.textShadow = '0 2px 14px rgba(0,0,0,0.4)';
          if (el.type === 'logo' && el.logoBg){
            div.style.background = el.logoBg;
            div.style.borderRadius = '50%';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'center';
          }
          div.textContent = el.text || '';
        } else {
          // Fallback: no canvas config, no inline style - use type-aware defaults
          div.style.position = 'absolute';
          div.style.display = 'flex';
          div.style.alignItems = 'center';
          div.style.justifyContent = 'center';
          div.style.textAlign = 'center';
          div.style.overflow = 'hidden';
          div.style.color = defaults.color || '#fff';
          div.style.fontWeight = defaults.fontWeight || 600;
          if (defaults.fontSize) div.style.fontSize = defaults.fontSize;
          if (defaults.lineHeight) div.style.lineHeight = defaults.lineHeight;
          if (defaults.width) div.style.width = defaults.width;
          div.style.left = defaults.left || '10%';
          if (defaults.top) div.style.top = defaults.top;
          if (defaults.bottom) div.style.bottom = defaults.bottom;
          if (defaults.right) div.style.right = defaults.right;
          div.style.textShadow = '0 2px 14px rgba(0,0,0,0.4)';
          const zMap = {verse:3, ref:2, copy:1, logo:4};
          div.style.zIndex = zMap[el.type] || 1;
          div.textContent = el.text || '';
        }

        stage.appendChild(div);
        hasRendered = true;

        // Keep verse/ref references for quick access
        if (el.type === 'verse' && el.text){ txt.textContent = el.text; }
        if (el.type === 'ref' && el.text){ ref.textContent = el.text; }
      }
    }

    if (!hasRendered){
      // No elements - fallback to plain text
      txt.style.display = '';
      ref.style.display = '';
      txt.textContent = theme.text || '';
      ref.textContent = theme.reference || '';
    }

    stage.classList.add("live");
  }catch(e){
    showSlide(theme.text||'', (theme.reference||'') + (theme.translation?(' ('+theme.translation+')'):'') );
  }
}

// Fullscreen on double-click or F key
function toggleFullscreen(){
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener("dblclick", toggleFullscreen);
document.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") toggleFullscreen();
});

// Auto-hide cursor after 2 seconds of no mouse movement (projector-friendly)
let _cursorTimer;
function showCursor(){
  document.body.classList.remove("hide-cursor");
  clearTimeout(_cursorTimer);
  _cursorTimer = setTimeout(() => {
    document.body.classList.add("hide-cursor");
  }, 2000);
}
document.addEventListener("mousemove", showCursor);
showCursor();

// Fade hint away
setTimeout(() => { hint.style.opacity = "0"; }, 5000);
</script>
</body>
</html>
