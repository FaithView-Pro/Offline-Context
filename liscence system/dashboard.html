<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FaithView Pro — License Monitor (local test)</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36;
    --text: #e6e8ec; --dim: #8b93a3; --accent: #5b8cff;
    --green: #3ecf8e; --red: #ff5c5c; --amber: #e8b339;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .license-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
  }
  .lic-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .lic-key { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 600; }
  .lic-email { color: var(--dim); font-size: 13px; margin-left: 10px; }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .badge.active { background: rgba(62,207,142,.15); color: var(--green); }
  .badge.unactivated { background: rgba(139,147,163,.15); color: var(--dim); }
  .badge.revoked { background: rgba(255,92,92,.15); color: var(--red); }
  .devices { margin-top: 12px; }
  .device-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px;
  }
  .device-row:first-child { border-top: none; }
  .fp { font-family: ui-monospace, monospace; color: var(--dim); }
  .meta { color: var(--dim); font-size: 12px; }
  button {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .revoke-btn:hover { border-color: var(--red); color: var(--red); }
  .empty { color: var(--dim); font-size: 13px; padding: 20px 0; }
  .refresh-note { color: var(--dim); font-size: 11px; margin-top: 24px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .dot.active { background: var(--green); }
  .dot.deactivated { background: var(--dim); }
</style>
</head>
<body>
  <h1>FaithView Pro — License Monitor</h1>
  <div class="sub">Local test rig · polling every 3s · <span id="count"></span></div>
  <div id="root"></div>
  <div class="refresh-note">Deactivating a device frees the license so it can be activated elsewhere (device-switching enforcement).</div>

<script>
async function refresh() {
  const res = await fetch('/api/state');
  const data = await res.json();
  document.getElementById('count').textContent = data.length + ' license(s)';
  const root = document.getElementById('root');

  if (data.length === 0) {
    root.innerHTML = '<div class="empty">No licenses yet. POST to /dummy/payment to create one.</div>';
    return;
  }

  root.innerHTML = data.map(lic => `
    <div class="license-card">
      <div class="lic-head">
        <div>
          <span class="lic-key">${lic.license_key}</span>
          <span class="lic-email">${lic.email}</span>
        </div>
        <div>
          <span class="badge ${lic.status}">${lic.status}</span>
          ${lic.status !== 'revoked' ? `<button class="revoke-btn" onclick="revokeLicense(${lic.id})">Revoke</button>` : ''}
        </div>
      </div>
      <div class="devices">
        ${lic.devices.length === 0 ? '<div class="meta">No devices activated yet</div>' : lic.devices.map(d => `
          <div class="device-row">
            <div>
              <span class="dot ${d.status}"></span>
              <span class="fp">${d.fingerprint.slice(0, 20)}${d.fingerprint.length > 20 ? '…' : ''}</span>
              <div class="meta">activated ${fmt(d.activated_at)} · last seen ${fmt(d.last_seen)} · token expires ${fmt(d.token_expires_at)}</div>
            </div>
            ${d.status === 'active' ? `<button onclick="deactivate(${d.id})">Deactivate</button>` : '<span class="meta">deactivated</span>'}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function deactivate(deviceId) {
  await fetch(`/admin/devices/${deviceId}/deactivate`, { method: 'POST' });
  refresh();
}

async function revokeLicense(licenseId) {
  if (!confirm('Revoke this license? This deactivates all its devices.')) return;
  await fetch(`/admin/licenses/${licenseId}/revoke`, { method: 'POST' });
  refresh();
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
